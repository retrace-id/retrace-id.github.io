<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ReTrace — Even laden…</title>
  <style>
    body {
      font-family: sans-serif;
      background: #0D0D1A;
      color: #FFD600;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      font-size: 1.2rem;
    }
  </style>
</head>
<body>
  <p>⏳ Even doorsturen…</p>
  <script>
    // ── SCHAKELAAR: commentaar (//) = uitgeschakeld ─────────
    //
    // FASE 1 — Nu (huidige site van de nonkel):
    const TARGET_BASE = "https://retrace.tomlejeune.be/scan/";
    //
    // FASE 2 — Later (eigen Firebase pagina, einde jaar):
    // const TARGET_BASE = "https://retrace-id.github.io/bandje.html?id=";
    //
    // Om te wisselen: zet // voor de actieve regel en
    // verwijder // voor de andere regel. Opslaan en klaar!
    // ────────────────────────────────────────────────────────

    const path  = window.location.pathname;
    const parts = path.split('/').filter(Boolean);
    const params = new URLSearchParams(window.location.search);

    let id = params.get('id')
          || parts[parts.length - 1]
          || null;

    if (id && id !== 'scan') {
      window.location.replace(TARGET_BASE + id);
    } else {
      document.querySelector('p').textContent = '❌ Geen bandje-ID gevonden. Scan de QR-code opnieuw.';
    }
  </script>
</body>
</html>
