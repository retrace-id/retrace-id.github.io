<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ReTrace — Even laden…</title>
  <style>
    body {
      font-family: sans-serif;
      background: #0D0D1A;
      color: #FFD600;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      font-size: 1.2rem;
    }
  </style>
</head>
<body>
  <p>⏳ Even doorsturen…</p>
  <script>
    // ── AANPASSEN ALS JE VAN SITE WISSELT ──────────────────
    const TARGET_BASE = "https://retrace.tomlejeune.be/scan/";
    // ───────────────────────────────────────────────────────

    // Haal het ID op uit de URL
    // Werkt voor zowel:
    //   retrace-id.github.io/?id=dz4lgz2d
    //   retrace-id.github.io/scan/dz4lgz2d
    const path  = window.location.pathname; // bv. /scan/dz4lgz2d
    const parts = path.split('/').filter(Boolean); // ['scan', 'dz4lgz2d']
    const params = new URLSearchParams(window.location.search);

    let id = params.get('id')               // ?id=dz4lgz2d
          || parts[parts.length - 1]        // /scan/dz4lgz2d → dz4lgz2d
          || null;

    if (id && id !== 'scan') {
      window.location.replace(TARGET_BASE + id);
    } else {
      document.querySelector('p').textContent = '❌ Geen bandje-ID gevonden. Scan de QR-code opnieuw.';
    }
  </script>
</body>
</html>
